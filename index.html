<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>でんしゃで かぞえよう</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 65%, #90EE90 65%, #7CCD7C 100%);
        }

        /* 電車が右から走ってきて止まるアニメーション */
        .train-enter {
            animation: trainDriveIn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 電車が左へ走り去るアニメーション */
        .train-exit {
            animation: trainDriveOut 1.0s ease-in forwards;
        }

        @keyframes trainDriveIn {
            0% { transform: translateX(120vw); }
            100% { transform: translateX(0); }
        }

        @keyframes trainDriveOut {
            0% { transform: translateX(0); }
            100% { transform: translateX(-120vw); }
        }

        /* タッチ時の跳ねるアニメーション */
        .bounce-touch {
            animation: bounce 0.4s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.08); }
        }

        /* ポップイン・花丸アニメーション */
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* 雲の背景アニメーション */
        .cloud-move {
            animation: cloudMove 30s linear infinite;
        }

        @keyframes cloudMove {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(100vw); }
        }

        /* 間違えた場合の優しい揺れアニメーション */
        .shake-touch {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative overflow-hidden">

    <!-- 背景の雲 -->
    <div class="absolute top-6 left-0 w-full pointer-events-none z-0">
        <svg class="cloud-move opacity-80 w-24 h-16 text-white fill-current" viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
    </div>

    <!-- 画面上部：全10問の進捗星マーク -->
    <header class="w-full max-w-4xl pt-4 px-4 z-10">
        <div class="bg-white/80 backdrop-blur-md rounded-2xl p-3 shadow-lg flex justify-between items-center border-4 border-white">
            <div id="progress-container" class="flex justify-around w-full items-center gap-1">
                <!-- JSで10個の進捗アイコンを動的生成 -->
            </div>
        </div>
    </header>

    <!-- 画面中央：メインステージ -->
    <main class="w-full flex-1 flex flex-col justify-center items-center relative z-10 px-2">
        
        <!-- 正解時の花丸オーバーレイ -->
        <div id="reward-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none z-30 hidden">
            <div class="pop-in flex flex-col items-center">
                <svg class="w-48 h-48 sm:w-64 sm:h-64 text-red-500 drop-shadow-2xl" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#FF3B30" stroke-width="8" stroke-dasharray="6 4" />
                    <circle cx="50" cy="50" r="30" fill="none" stroke="#FF9500" stroke-width="6" />
                    <path d="M 35 50 L 45 60 L 68 35" fill="none" stroke="#FF3B30" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
        </div>

        <!-- 電車配置エリア -->
        <div class="w-full max-w-5xl flex justify-center items-end min-h-[220px] sm:min-h-[280px] mb-2 relative">
            <div id="train-wrapper" class="flex items-end justify-center gap-1 sm:gap-2 transition-transform duration-300">
                <!-- 電車がここに生成されます -->
            </div>
        </div>

        <!-- 線路 -->
        <div class="w-full max-w-5xl h-8 bg-amber-800 rounded-lg relative shadow-xl flex items-center justify-around border-t-4 border-amber-950">
            <div class="absolute inset-0 flex justify-between px-2 overflow-hidden pointer-events-none">
                <div class="w-full h-full flex justify-between">
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                    <div class="w-2 h-full bg-amber-950 opacity-40"></div>
                </div>
            </div>
            <div class="absolute -top-2 left-0 right-0 h-1.5 bg-gray-300 shadow-sm"></div>
            <div class="absolute -top-0.5 left-0 right-0 h-1.5 bg-gray-400 shadow-sm"></div>
        </div>

        <!-- 画面下部：数字選択エリア -->
        <div id="choice-container" class="w-full max-w-2xl mt-4 flex flex-wrap justify-center items-center gap-3 sm:gap-6 min-h-[100px] z-20 px-2">
            <!-- 選択肢ボタンがJSで配置されます -->
        </div>

    </main>

    <!-- スタート画面 ＆ 全問終了お祝い画面 -->
    <div id="modal-overlay" class="fixed inset-0 bg-sky-900/70 backdrop-blur-md flex items-center justify-center z-50 transition-opacity duration-300">
        
        <!-- スタートパネル -->
        <div id="modal-start" class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-11/12 flex flex-col items-center shadow-2xl border-8 border-yellow-300 text-center">
            <div class="w-24 h-24 sm:w-28 sm:h-28 mb-3 text-sky-500">
                <svg class="w-full h-full fill-current drop-shadow-md" viewBox="0 0 24 24">
                    <path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zm0 2c3.71 0 5.83.42 6 2H6c.17-1.58 2.29-2 6-2zm6 11c0 .83-.67 1.5-1.5 1.5h-9C6.67 16.5 6 15.83 6 15v-3h12v3zm0-5H6V8h12v2z"/>
                    <circle cx="8.5" cy="13.5" r="1.5"/>
                    <circle cx="15.5" cy="13.5" r="1.5"/>
                </svg>
            </div>

            <!-- 難易度選択（2択・3択・4択・5択） -->
            <div class="w-full mb-6 bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 flex flex-col items-center gap-3">
                <div id="option-selector" class="grid grid-cols-4 gap-2 w-full">
                    <button data-count="2" class="option-btn py-3 px-1 rounded-2xl border-4 font-black text-2xl transition-all duration-200 bg-sky-500 text-white border-sky-600 shadow-lg scale-105">2</button>
                    <button data-count="3" class="option-btn py-3 px-1 rounded-2xl border-4 font-black text-2xl transition-all duration-200 bg-white text-gray-700 border-gray-300 hover:bg-gray-100">3</button>
                    <button data-count="4" class="option-btn py-3 px-1 rounded-2xl border-4 font-black text-2xl transition-all duration-200 bg-white text-gray-700 border-gray-300 hover:bg-gray-100">4</button>
                    <button data-count="5" class="option-btn py-3 px-1 rounded-2xl border-4 font-black text-2xl transition-all duration-200 bg-white text-gray-700 border-gray-300 hover:bg-gray-100">5</button>
                </div>
            </div>

            <!-- スタートボタン -->
            <button id="btn-start" class="w-full py-5 bg-green-500 hover:bg-green-600 active:scale-95 text-white rounded-2xl text-3xl font-bold shadow-xl border-b-8 border-green-700 flex justify-center items-center gap-3">
                <svg class="w-12 h-12 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>

        <!-- 10問完了パネル -->
        <div id="modal-complete" class="bg-white rounded-3xl p-8 max-w-sm w-11/12 flex flex-col items-center shadow-2xl border-8 border-yellow-400 text-center hidden">
            <div class="w-32 h-32 mb-2 text-yellow-400 pop-in">
                <svg class="w-full h-full fill-current drop-shadow-lg" viewBox="0 0 24 24">
                    <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1c2.21-.4 3.99-2.12 4.39-4.39C19.8 11.3 21 9.3 21 7V6c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
                </svg>
            </div>
            <div class="w-20 h-20 mb-6 text-red-500">
                <svg class="w-full h-full fill-current" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#FF3B30" stroke-width="8" stroke-dasharray="6 4" />
                    <circle cx="50" cy="50" r="30" fill="none" stroke="#FF9500" stroke-width="6" />
                    <path d="M 35 50 L 45 60 L 68 35" fill="none" stroke="#FF3B30" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <button id="btn-replay" class="w-full py-5 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white rounded-2xl shadow-xl border-b-8 border-sky-700 flex justify-center items-center">
                <svg class="w-12 h-12 fill-current" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // ゲーム制御データ
        const TOTAL_QUESTIONS = 10;
        let currentQuestion = 0;
        let targetCarCount = 0;
        let currentTapCount = 0;
        let choiceOptionCount = 2;
        let isAnimating = false;
        let isAnswered = false;

        // 高コントラストカラー
        const CAR_COLORS = [
            { bg: '#FF3B30', border: '#C41E14', text: '#FFFFFF' },
            { bg: '#007AFF', border: '#0040A8', text: '#FFFFFF' },
            { bg: '#FFCC00', border: '#C79A00', text: '#000000' },
            { bg: '#34C759', border: '#1B8A37', text: '#FFFFFF' },
            { bg: '#FF9500', border: '#C76A00', text: '#FFFFFF' },
            { bg: '#AF52DE', border: '#74229C', text: '#FFFFFF' }
        ];

        const NUMBER_VOICES = ['いち', 'に', 'さん', 'よん', 'ご'];

        // Web Audio API
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPopSound(pitchMultiplier = 1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300 * pitchMultiplier, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600 * pitchMultiplier, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playFanfareSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + index * 0.1);
                gain.gain.setValueAtTime(0, now + index * 0.1);
                gain.gain.setValueAtTime(0.4, now + index * 0.1 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.1);
                osc.stop(now + index * 0.1 + 0.4);
            });
        }

        function playGrandFanfare() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const melody = [
                { f: 523.25, t: 0 }, { f: 523.25, t: 0.15 }, { f: 523.25, t: 0.3 },
                { f: 659.25, t: 0.45 }, { f: 783.99, t: 0.75 }, { f: 1046.50, t: 1.05 }
            ];
            melody.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(note.f, now + note.t);
                gain.gain.setValueAtTime(0.5, now + note.t);
                gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + note.t);
                osc.stop(now + note.t + 0.4);
            });
        }

        function speakNumber(num) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                setTimeout(() => {
                    const text = NUMBER_VOICES[num - 1] || num.toString();
                    const uttr = new SpeechSynthesisUtterance(text);
                    uttr.lang = 'ja-JP';
                    uttr.rate = 0.9;
                    uttr.pitch = 1.2;
                    window.speechSynthesis.speak(uttr);
                }, 40);
            }
        }

        function warmUpSpeech() {
            if ('speechSynthesis' in window) {
                const uttr = new SpeechSynthesisUtterance('');
                uttr.lang = 'ja-JP';
                window.speechSynthesis.speak(uttr);
            }
        }

        function initProgressUI() {
            const container = document.getElementById('progress-container');
            container.innerHTML = '';
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const star = document.createElement('div');
                star.id = `progress-star-${i}`;
                star.className = 'w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-gray-200 border-2 border-gray-300 flex items-center justify-center transition-all duration-300';
                star.innerHTML = `
                    <svg class="w-4 h-4 sm:w-6 sm:h-6 text-gray-400 fill-current" viewBox="0 0 24 24">
                        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                `;
                container.appendChild(star);
            }
        }

        function updateProgressUI() {
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const star = document.getElementById(`progress-star-${i}`);
                if (i < currentQuestion) {
                    star.className = 'w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-yellow-400 border-2 border-yellow-500 flex items-center justify-center shadow-md scale-105';
                    star.innerHTML = `<svg class="w-5 h-5 sm:w-7 sm:h-7 text-white fill-current drop-shadow" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
                } else if (i === currentQuestion) {
                    star.className = 'w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-sky-500 border-4 border-sky-200 flex items-center justify-center animate-pulse shadow-lg';
                    star.innerHTML = `<svg class="w-5 h-5 sm:w-7 sm:h-7 text-white fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
                } else {
                    star.className = 'w-7 h-7 sm:w-9 sm:h-9 rounded-full bg-gray-200 border-2 border-gray-300 flex items-center justify-center opacity-60';
                    star.innerHTML = `<svg class="w-4 h-4 sm:w-6 sm:h-6 text-gray-400 fill-current" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
                }
            }
        }

        function createTrain(totalCars) {
            const trainWrapper = document.getElementById('train-wrapper');
            trainWrapper.innerHTML = '';
            trainWrapper.className = 'flex items-end justify-center gap-1 sm:gap-2 transition-transform duration-300 train-enter';

            let shuffledColors = [...CAR_COLORS].sort(() => Math.random() - 0.5);

            for (let i = 0; i < totalCars; i++) {
                const carColor = shuffledColors[i % shuffledColors.length];
                const carContainer = document.createElement('div');
                carContainer.className = 'flex items-end';

                const car = document.createElement('div');
                car.dataset.index = i;
                car.dataset.counted = "false";
                car.className = 'car-item relative flex flex-col items-center justify-end cursor-pointer select-none active:scale-95 transition-transform duration-150 mb-1';

                if (i === 0) {
                    // 1両目（先頭機関車）
                    car.innerHTML = `
                        <div class="w-5 h-6 bg-gray-700 rounded-t-md mb-[-2px]"></div>
                        <div class="car-body w-24 h-24 sm:w-32 sm:h-32 rounded-3xl shadow-xl flex flex-col justify-between items-center p-2 relative border-4 transition-all duration-300" style="background-color: ${carColor.bg}; border-color: ${carColor.border};">
                            <div class="w-full flex justify-around items-center pt-1">
                                <div class="w-6 h-6 sm:w-8 sm:h-8 bg-amber-200 rounded-full border-2 border-amber-400 shadow-inner"></div>
                                <div class="w-10 h-8 sm:w-12 sm:h-10 bg-sky-200 rounded-lg border-2 border-white shadow-inner flex items-center justify-center">
                                    <div class="w-3 h-3 bg-white rounded-full opacity-60"></div>
                                </div>
                            </div>
                            <div class="number-display text-4xl sm:text-6xl font-black transition-all duration-300 drop-shadow-md flex items-center justify-center flex-1 z-10" style="color: ${carColor.text}; opacity: 0; transform: scale(0.5);">1</div>
                            <div class="w-full flex justify-center items-center gap-2 pb-1">
                                <div class="w-3 h-3 bg-gray-800 rounded-full"></div>
                                <div class="w-4 h-2 border-b-4 border-gray-800 rounded-full"></div>
                                <div class="w-3 h-3 bg-gray-800 rounded-full"></div>
                            </div>
                        </div>
                        <div class="flex justify-between w-20 sm:w-28 -mt-4 z-10 px-1">
                            <div class="w-7 h-7 sm:w-9 sm:h-9 bg-gray-800 rounded-full border-4 border-gray-300 shadow-md flex items-center justify-center"><div class="w-2 h-2 bg-gray-400 rounded-full"></div></div>
                            <div class="w-7 h-7 sm:w-9 sm:h-9 bg-gray-800 rounded-full border-4 border-gray-300 shadow-md flex items-center justify-center"><div class="w-2 h-2 bg-gray-400 rounded-full"></div></div>
                        </div>
                    `;
                } else {
                    // 2両目以降（客車）
                    car.innerHTML = `
                        <div class="car-body w-24 h-24 sm:w-32 sm:h-32 rounded-3xl shadow-xl flex flex-col justify-between items-center p-2 relative border-4 transition-all duration-300" style="background-color: ${carColor.bg}; border-color: ${carColor.border};">
                            <div class="w-full flex justify-around items-center pt-1">
                                <div class="w-7 h-6 sm:w-9 sm:h-8 bg-sky-100 rounded-md border-2 border-white shadow-inner"></div>
                                <div class="w-7 h-6 sm:w-9 sm:h-8 bg-sky-100 rounded-md border-2 border-white shadow-inner"></div>
                            </div>
                            <div class="number-display text-4xl sm:text-6xl font-black transition-all duration-300 drop-shadow-md flex items-center justify-center flex-1" style="color: ${carColor.text}; opacity: 0; transform: scale(0.5);">${i + 1}</div>
                            <div class="w-full h-2 rounded-full bg-white/40 mb-1"></div>
                        </div>
                        <div class="flex justify-between w-20 sm:w-28 -mt-4 z-10 px-1">
                            <div class="w-7 h-7 sm:w-9 sm:h-9 bg-gray-800 rounded-full border-4 border-gray-300 shadow-md flex items-center justify-center"><div class="w-2 h-2 bg-gray-400 rounded-full"></div></div>
                            <div class="w-7 h-7 sm:w-9 sm:h-9 bg-gray-800 rounded-full border-4 border-gray-300 shadow-md flex items-center justify-center"><div class="w-2 h-2 bg-gray-400 rounded-full"></div></div>
                        </div>
                    `;
                }

                car.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    onCarTap(car, i);
                });

                carContainer.appendChild(car);

                if (i < totalCars - 1) {
                    const coupler = document.createElement('div');
                    coupler.className = 'w-3 h-3 bg-gray-700 mb-6 rounded-sm';
                    carContainer.appendChild(coupler);
                }

                trainWrapper.appendChild(carContainer);
            }
        }

        function createChoices() {
            const container = document.getElementById('choice-container');
            container.innerHTML = '';
            isAnswered = false;

            const availableWrong = [1, 2, 3, 4, 5].filter(n => n !== targetCarCount);
            availableWrong.sort(() => Math.random() - 0.5);

            const neededWrongCount = choiceOptionCount - 1;
            const wrongNumbers = availableWrong.slice(0, neededWrongCount);

            const choices = [targetCarCount, ...wrongNumbers];
            choices.sort(() => Math.random() - 0.5);

            let sizeClasses = 'w-24 h-24 sm:w-32 sm:h-32 text-5xl sm:text-7xl border-4 sm:border-8';
            if (choiceOptionCount === 4) {
                sizeClasses = 'w-18 h-18 sm:w-24 sm:h-24 md:w-28 md:h-28 text-4xl sm:text-6xl border-4 sm:border-[6px]';
            } else if (choiceOptionCount === 5) {
                sizeClasses = 'w-14 h-14 sm:w-20 sm:h-20 md:w-24 md:h-24 text-3xl sm:text-5xl border-4 sm:border-[6px]';
            }

            choices.forEach(num => {
                const btn = document.createElement('button');
                btn.className = `choice-btn ${sizeClasses} bg-white/60 border-gray-300 rounded-3xl shadow-md flex items-center justify-center font-black text-gray-400 transition-all duration-300 select-none opacity-40 pointer-events-none scale-95`;
                btn.textContent = num;
                btn.dataset.number = num;

                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    onChoiceTap(num, btn);
                });

                container.appendChild(btn);
            });
        }

        function highlightChoices() {
            const btns = document.querySelectorAll('.choice-btn');
            btns.forEach(btn => {
                btn.classList.remove('opacity-40', 'pointer-events-none', 'border-gray-300', 'text-gray-400', 'bg-white/60', 'scale-95', 'shadow-md');
                btn.classList.add('opacity-100', 'pointer-events-auto', 'border-yellow-400', 'text-gray-800', 'bg-white', 'shadow-xl', 'bounce-touch', 'scale-105');
            });
        }

        function onChoiceTap(selectedNum, btnElement) {
            if (isAnimating || isAnswered || currentTapCount < targetCarCount) return;

            if (selectedNum === targetCarCount) {
                isAnswered = true;
                btnElement.classList.add('bg-green-200', 'border-green-500', 'scale-110');
                playPopSound(1.5);
                handleQuestionComplete();
            } else {
                playPopSound(0.5);
                btnElement.classList.add('shake-touch', 'opacity-50');
                setTimeout(() => {
                    btnElement.classList.remove('shake-touch');
                }, 400);
            }
        }

        function onCarTap(carElement, index) {
            if (isAnimating) return;

            if (carElement.dataset.counted === "true") {
                const num = parseInt(carElement.querySelector('.number-display').textContent);
                playPopSound(1 + num * 0.1);
                speakNumber(num);
                carElement.classList.add('bounce-touch');
                setTimeout(() => carElement.classList.remove('bounce-touch'), 400);
                return;
            }

            currentTapCount++;
            carElement.dataset.counted = "true";

            const numDisplay = carElement.querySelector('.number-display');
            numDisplay.textContent = currentTapCount;
            numDisplay.style.opacity = '1';
            numDisplay.style.transform = 'scale(1.2)';
            setTimeout(() => {
                numDisplay.style.transform = 'scale(1.0)';
            }, 200);

            carElement.classList.add('bounce-touch');
            setTimeout(() => carElement.classList.remove('bounce-touch'), 400);

            playPopSound(1 + currentTapCount * 0.1);
            speakNumber(currentTapCount);

            if (currentTapCount === targetCarCount) {
                highlightChoices();
            }
        }

        function handleQuestionComplete() {
            isAnimating = true;

            setTimeout(() => {
                playFanfareSound();
                
                const rewardOverlay = document.getElementById('reward-overlay');
                rewardOverlay.classList.remove('hidden');

                setTimeout(() => {
                    rewardOverlay.classList.add('hidden');
                    
                    const trainWrapper = document.getElementById('train-wrapper');
                    trainWrapper.className = 'flex items-end justify-center gap-1 sm:gap-2 transition-transform duration-300 train-exit';

                    setTimeout(() => {
                        currentQuestion++;
                        updateProgressUI();

                        if (currentQuestion >= TOTAL_QUESTIONS) {
                            showCompleteModal();
                        } else {
                            startNextQuestion();
                        }
                    }, 1000);

                }, 1800);

            }, 400);
        }

        function startNextQuestion() {
            currentTapCount = 0;
            let newCount;
            do {
                newCount = Math.floor(Math.random() * 5) + 1;
            } while (newCount === targetCarCount && Math.random() > 0.3);
            
            targetCarCount = newCount;

            createTrain(targetCarCount);
            createChoices();
            isAnimating = false;
        }

        function showCompleteModal() {
            playGrandFanfare();
            const modalOverlay = document.getElementById('modal-overlay');
            const modalStart = document.getElementById('modal-start');
            const modalComplete = document.getElementById('modal-complete');

            modalOverlay.classList.remove('hidden');
            modalStart.classList.add('hidden');
            modalComplete.classList.remove('hidden');
        }

        function resetGame() {
            currentQuestion = 0;
            currentTapCount = 0;
            updateProgressUI();

            const modalOverlay = document.getElementById('modal-overlay');
            modalOverlay.classList.add('hidden');

            startNextQuestion();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initProgressUI();

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(btn => {
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    const count = parseInt(btn.dataset.count);
                    choiceOptionCount = count;

                    optionBtns.forEach(b => {
                        b.className = 'option-btn py-3 px-1 rounded-2xl border-4 font-black text-2xl transition-all duration-200 bg-white text-gray-700 border-gray-300 hover:bg-gray-100';
                    });
                    btn.className = 'option-btn py-3 px-1 rounded-2xl border-4 font-black text-2xl transition-all duration-200 bg-sky-500 text-white border-sky-600 shadow-lg scale-105';
                    
                    playPopSound(1.1 + count * 0.1);
                });
            });

            document.getElementById('btn-start').addEventListener('click', () => {
                initAudio();
                warmUpSpeech();
                resetGame();
            });

            document.getElementById('btn-replay').addEventListener('click', () => {
                initAudio();
                warmUpSpeech();
                resetGame();
            });
        });
    </script>
</body>
</html>
